[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zhuo-chong"
version = "3.0.0"
description = "栖水 · An offline pond companion with focus sessions and small tasks"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [{name = "bruceyuan357"}, {name = "richer-richard"}]
keywords = ["desktop-pet", "pygame", "focus-timer", "water-pond", "桌宠"]
dependencies = ["pygame>=2.6.1,<3"]

[project.urls]
Homepage = "https://github.com/bruceyuan357/zhuo-chong"
Repository = "https://github.com/bruceyuan357/zhuo-chong.git"
Issues = "https://github.com/bruceyuan357/zhuo-chong/issues"

[project.scripts]
zhuo-chong = "pondpet.app:main"

[tool.setuptools.packages.find]
include = ["pondpet*"]

[tool.setuptools.package-data]
pondpet = ["assets/*.png", "assets/*.md", "assets/icons/*.png", "assets/icons/LICENSE"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E402"]
